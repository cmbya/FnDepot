name: Update FnDepot Source

on:
  workflow_dispatch:
  schedule:
    # 每天一次。UTC 01:33 = 北京时间 09:33
    - cron: "33 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 更新 fnpack.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_fndepot.py

      - name: 校验 JSON
        run: |
          python3 -m json.tool fnpack.json >/dev/null
          echo "fnpack.json JSON 校验通过"

      - name: 提交更新
        run: |
          if git diff --quiet; then
            echo "没有变化，不需要提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fnpack.json assets/icons
          git commit -m "chore: update FnDepot index"
          git push
